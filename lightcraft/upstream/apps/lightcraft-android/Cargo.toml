[package]
name = "lightcraft-android"
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LightCraft for Android (tablet): photo library + non-destructive raw developer"

[lib]
crate-type = ["cdylib"]

[dependencies]
# eframe on Android: NativeActivity entry, wgpu renderer. NOTE: the `accesskit`
# feature is a compile error with `android-native-activity`, so it is
# deliberately absent here (same as the desktop's android-incompatible split).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = "0.37"
android-activity = { version = "=0.6.1", features = ["native-activity"] }
# Shared suite shell: JNI bridge, storage, SAF, pen, GPU cascade.
craftapps-shared = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-raster = { workspace = true }
jni = "=0.22.4"
ndk-context = "=0.1.1"
log = "0.4"
android_logger = "0.15"
serde_json = "1"

# NOTE: this crate does NOT forbid unsafe: the JNI calls an Android shell
# fundamentally needs. It denies unwrap/expect/panic/todo like every other
# crate, and every unsafe block carries a SAFETY comment.
