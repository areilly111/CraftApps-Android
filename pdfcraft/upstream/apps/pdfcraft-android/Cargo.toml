[package]
name = "pdfcraft-android"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PdfCraft for Android (tablet): eframe NativeActivity shell around the shared egui app"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-ui-egui = { workspace = true }
# Shared suite shell (updater, GPU cascade, storage, SAF, JNI bridge).
craftapps-shared = { path = "../../../../shared" }
# eframe on Android: NativeActivity entry, wgpu renderer. NOTE: the `accesskit`
# feature is a compile error with `android-native-activity` (see eframe 0.36.2
# src/lib.rs), so it is deliberately absent here — unlike the desktop app's
# dependency, which keeps it.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = "=0.22.4"
ndk-context = "=0.1.1"
log = { workspace = true }
android_logger = "0.15"
serde_json = { workspace = true }

[lints]
# NOTE: this crate does NOT inherit workspace lints: `unsafe_code = "forbid"`
# there would rule out the JNI calls an Android shell fundamentally needs.
# Instead lib.rs denies unwrap/expect/panic/todo like every other crate, and
# every unsafe block carries a SAFETY comment (the photocraft-tablet pattern).
