[package]
name = "filmcraft-mpeg2v"
description = "Clean-room MPEG-2 video (ITU-T H.262 | ISO/IEC 13818-2) and MPEG-1 video (ISO/IEC 11172-2) decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
