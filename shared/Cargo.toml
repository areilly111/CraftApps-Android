[package]
name = "craftapps-shared"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared Android shell code for the CraftApps suite (updater, GPU cascade, storage, SAF, JNI)"

[lib]
name = "craftapps_shared"
crate-type = ["rlib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
egui = "0.36"
jni = "=0.22.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
ndk-context = "=0.1.1"
android_logger = "0.15"

# NOTE: this crate does NOT forbid unsafe: the JNI bridge fundamentally needs
# it. Every unsafe block carries a SAFETY comment (the photocraft-tablet
# pattern), and unwrap/expect/panic/todo are denied above.
