[package]
name = "cadcraft-android"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CADCraft for Android (tablet): native eframe port with stylus, SAF pickers and hardware acceleration"

[lib]
crate-type = ["cdylib"]

[dependencies]
# eframe on Android: NativeActivity entry, wgpu renderer. The `accesskit`
# feature is a compile error with `android-native-activity` (eframe 0.37),
# so it is deliberately absent here. cadcraft-ui-egui depends on egui only,
# never eframe, so no accesskit split is needed in its Cargo.toml (the
# SoundCraft arrangement).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = "0.37"
android-activity = { version = "=0.6.1", features = ["native-activity"] }
# Shared suite shell: JNI bridge, SAF pickers, storage, GPU cascade, pen input.
craftapps-shared = { path = "../../../../shared" }
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
jni = "=0.22.4"
ndk-context = "=0.1.1"
log = "0.4"
android_logger = "0.15"
serde_json = { workspace = true }

# NOTE: this crate does NOT opt into the workspace lints (`unsafe_code =
# "forbid"`): the JNI entries an Android shell fundamentally needs are unsafe.
# It denies unwrap/expect/panic/todo like every other port crate, and every
# unsafe block carries a SAFETY comment.
